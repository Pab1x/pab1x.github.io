[[news]]
date = "2026-10"
content = "Two new preprints on skills are out: [SCOPED](https://arxiv.org/abs/2610.22217) on skill-decoupled expert distillation, and [Procedural Exposure Bias](https://arxiv.org/abs/2610.26062) on how skill representations shape agent decisions."

[[news]]
date = "2026-10"
content = "Our preprint [Chaos in the Text](https://arxiv.org/abs/2610.11816) is out, showing how irrelevant text can outrank relevant images in multimodal retrieval."

[[news]]
date = "2026-09"
content = "Our survey, [Recursive Self-Improvement in AI: A Survey](https://www.preprints.org/manuscript/202609.2680), is now available!"

[[news]]
date = "2026-08"
content = "Our [ConceptFormer](https://arxiv.org/abs/2608.15698) preprint is now available, introducing a latent-concept approach to visual document retrieval."

[[news]]
date = "2026-05"
content = "We released [CC-OCR V2](https://arxiv.org/abs/2605.03903), a benchmark for fine-grained failure attribution in real-world visual document understanding."

[[news]]
date = "2026-04"
content = "Three papers accepted to **ACL 2026**: [UNIKIE-BENCH](https://aclanthology.org/2026.acl-long.287/) in the main conference; [Lang2Act](https://aclanthology.org/2026.findings-acl.409/) and [Genii](https://aclanthology.org/2026.findings-acl.71/) in Findings."

[[news]]
date = "2026-04"
content = "Two papers, [MoRE](https://github.com/OpenBMB/MoRE) and [ReAlign](https://github.com/NEUIR/ReAlign), accepted to **SIGIR 2026**!"
